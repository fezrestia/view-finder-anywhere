name: Commit Trigger Build Test Check

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

  workflow_dispatch:

jobs:
  build_test_check:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Env
        run: |
          # Accept android sdk licenses.
          set +o pipefail
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses
          set -o pipefail

          # add permission.
          chmod +x ./gradlew

      - name: Build
        run: |
          ./gradlew assembleDebug

      - name: Test
        run: |
          ./gradlew testDebug

      - name: Check
        run: |
          ./gradlew lintDebug

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/test-results/**/*.xml

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/apk/debug/*.apk

