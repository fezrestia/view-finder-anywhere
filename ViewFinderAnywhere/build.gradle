apply plugin: 'com.android.application'

// Add for FireBase.
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

import java.util.regex.Pattern

import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile

android {
    namespace 'com.fezrestia.android.viewfinderanywhere'

    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId "com.fezrestia.android.viewfinderanywhere"
        minSdk 34
        targetSdk 36

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_TOOLCHAIN=clang"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    productFlavors {
    }

    androidComponents {
        onVariants(selector().withBuildType("release")) { variant ->
            variant.outputs.forEach { output ->
                def ver = output.versionName.orNull
                if (ver != null) {
                    def currentName = output.outputFileName.get()
                    def name = currentName.substring(0, currentName.lastIndexOf('.'))
                    name = name.replace("-release", "")
                    output.outputFileName.set("${name}_${ver}.apk")
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            version "3.22.1"
            path file("src/main/cpp/CMakeLists.txt")
        }
    }

    ndkVersion '30.0.14904198 rc1'

    lint {
        htmlOutput file("${project.getLayout().getBuildDirectory()}/reports/test-results-lint.html")
        lintConfig file('lint.xml')
        xmlOutput file("${project.getLayout().getBuildDirectory()}/reports/test-results-lint.xml")
    }

    incrementVersionCode()
}

tasks.withType(KotlinJvmCompile).configureEach {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
    }
}

def incrementVersionCode() {
    def file = file("src/main/AndroidManifest.xml")
    def text = file.getText()

    // Update version code.
    def codePattern = Pattern.compile("android:versionCode=\"(\\d+)\"")
    def codeMatcher = codePattern.matcher(text)
    codeMatcher.find()
    def code = Integer.parseInt(codeMatcher.group(1))
    def newCode = code + 1
    def codeUpdatedText = codeMatcher.replaceAll("android:versionCode=\"" + newCode + "\"")

    // Update version name.
    def namePattern = Pattern.compile("android:versionName=\"(\\d+)\\.(\\d+)\\.(\\d+)-\\d+\"")
    def nameMatcher = namePattern.matcher(codeUpdatedText)
    nameMatcher.find()
    def major = Integer.parseInt(nameMatcher.group(1))
    def minor = Integer.parseInt(nameMatcher.group(2))
    def patch = Integer.parseInt(nameMatcher.group(3))
    def newName = "android:versionName=\"" + major + "." + minor + "." + patch + "-" + newCode + "\""
    def nameUpdatedText = nameMatcher.replaceAll(newName)

    file.write(nameUpdatedText)
}

dependencies {
    // FireBase.
    implementation platform('com.google.firebase:firebase-bom:34.13.0')
    implementation 'com.google.firebase:firebase-analytics:23.2.0'
    implementation 'com.google.firebase:firebase-crashlytics:20.0.6'

    // Kotlin support.
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.3.21'

    // Google play services.
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Android X
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
}
